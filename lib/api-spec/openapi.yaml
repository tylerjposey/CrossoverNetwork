openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: API specification
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
paths:
  /crossover/connections:
    get:
      operationId: getCrossoverConnections
      summary: Every saved Connect and Super Connect in this anonymous session
      responses:
        "200":
          description: Session connections, newest first, including previous decks
          content:
            application/json:
              schema: {$ref: "#/components/schemas/ConnectionList"}
  /crossover/connections/{id}/icebreaker:
    patch:
      operationId: editCrossoverIcebreaker
      summary: Save a manually edited draft without AI
      parameters:
        - in: path
          name: id
          required: true
          schema: {type: integer, minimum: 1}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/IcebreakerEdit"}
      responses:
        "200":
          description: Saved connection
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Connection"}
        "400":
          $ref: "#/components/responses/DeckActionError"
        "409":
          $ref: "#/components/responses/DeckActionError"
  /crossover/connections/{id}/reply:
    post:
      operationId: simulateCrossoverReply
      summary: Get a simulated reply from the fictional sample person; uses the shared AI quotas only when a new reply is generated
      parameters:
        - in: path
          name: id
          required: true
          schema: {type: integer, minimum: 1}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/ReplyInput"}
      responses:
        "200":
          description: Saved simulated reply (existing replies are returned without AI unless regenerate is true)
          content:
            application/json:
              schema: {$ref: "#/components/schemas/ReplyResult"}
        "400":
          $ref: "#/components/responses/FriendlyError"
        "429":
          $ref: "#/components/responses/FriendlyError"
        "503":
          $ref: "#/components/responses/FriendlyError"
  /crossover/profile:
    patch:
      operationId: updateCrossoverProfile
      summary: Save profile edits to this session without changing the deck or using AI
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/ProfileEdit"}
      responses:
        "200":
          $ref: "#/components/responses/SessionState"
        "400":
          $ref: "#/components/responses/DeckActionError"
        "409":
          $ref: "#/components/responses/DeckActionError"
  /crossover/profile/confirm:
    post:
      operationId: confirmCrossoverProfile
      summary: Acknowledge the parsed card before swiping
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/DeckReference"}
      responses:
        "200":
          $ref: "#/components/responses/SessionState"
        "400":
          $ref: "#/components/responses/DeckActionError"
        "409":
          $ref: "#/components/responses/DeckActionError"
  /crossover/deck/filter:
    post:
      operationId: setCrossoverDeckFilter
      summary: Narrow the current deck to a subset without AI; order and progress are preserved
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/DeckFilterInput"}
      responses:
        "200":
          $ref: "#/components/responses/SessionState"
        "400":
          $ref: "#/components/responses/DeckActionError"
        "409":
          $ref: "#/components/responses/DeckActionError"
  /crossover/swipes:
    post:
      operationId: createCrossoverSwipe
      summary: Persist the next card action without AI
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/SwipeInput"}
      responses:
        "200":
          $ref: "#/components/responses/SessionState"
        "400":
          $ref: "#/components/responses/DeckActionError"
        "409":
          $ref: "#/components/responses/DeckActionError"
  /crossover/swipes/undo:
    post:
      operationId: undoCrossoverSwipe
      summary: Undo the latest swipe in the current deck without AI
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/SwipeUndo"}
      responses:
        "200":
          $ref: "#/components/responses/SessionState"
        "400":
          $ref: "#/components/responses/DeckActionError"
        "409":
          $ref: "#/components/responses/DeckActionError"
  /crossover/deck:
    post:
      operationId: buildCrossoverDeck
      summary: Build a session deck with one charged AI request
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/DeckInput"}
      responses:
        "200":
          description: Validated matchmaking result
          content:
            application/json:
              schema: {$ref: "#/components/schemas/DeckBuild"}
        "400":
          $ref: "#/components/responses/FriendlyError"
        "422":
          $ref: "#/components/responses/FriendlyError"
        "429":
          $ref: "#/components/responses/FriendlyError"
        "503":
          $ref: "#/components/responses/FriendlyError"
  /crossover/icebreaker/rewrite:
    post:
      operationId: rewriteCrossoverIcebreaker
      summary: Rewrite one current-deck icebreaker using the shared AI quotas
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/IcebreakerInput"}
      responses:
        "200":
          description: A new draft
          content:
            application/json:
              schema: {$ref: "#/components/schemas/IcebreakerDraft"}
        "400":
          $ref: "#/components/responses/FriendlyError"
        "429":
          $ref: "#/components/responses/FriendlyError"
        "503":
          $ref: "#/components/responses/FriendlyError"
  /crossover/state:
    get:
      operationId: getCrossoverState
      summary: Resume this anonymous session without AI
      responses:
        "200":
          description: Session state and live remaining hourly quota
          content:
            application/json:
              schema: {$ref: "#/components/schemas/VisitorState"}
  /crossover/history:
    get:
      operationId: getCrossoverHistory
      summary: Public redacted usage history
      responses:
        "200":
          description: Newest first public records
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HistoryPage"
  /crossover/profiles:
    get:
      operationId: getCrossoverProfiles
      summary: Fictional sample people
      responses:
        "200":
          description: Sample profiles
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/SampleProfile"
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
components:
  responses:
    SessionState:
      description: Authoritative current session, including deck order and progress
      content:
        application/json:
          schema: {$ref: "#/components/schemas/VisitorState"}
    DeckActionError:
      description: Invalid or outdated deck action; refresh session state before retrying
      content:
        application/json:
          schema: {$ref: "#/components/schemas/DeckActionFailure"}
    FriendlyError:
      description: Friendly error; input remains saved and no raw provider errors are exposed
      content:
        application/json:
          schema: {$ref: "#/components/schemas/ActionError"}
  schemas:
    IcebreakerEdit:
      type: object
      additionalProperties: false
      required: [icebreaker]
      properties:
        icebreaker: {type: string, minLength: 1, maxLength: 299}
    DeckFilter:
      type: string
      enum: [all, other_schools, other_majors, shared_interests, similar_goals]
    DeckFilterInput:
      type: object
      additionalProperties: false
      required: [deck_id, filter]
      properties:
        deck_id: {type: string, minLength: 1}
        filter: {$ref: "#/components/schemas/DeckFilter"}
    DeckFilterOption:
      type: object
      required: [id, available, count, remaining]
      properties:
        id: {$ref: "#/components/schemas/DeckFilter"}
        available: {type: boolean, description: False when the visitor profile lacks the fact this filter compares}
        count: {type: integer, minimum: 0, description: Cards in this deck that match}
        remaining: {type: integer, minimum: 0, description: Matching cards not yet swiped}
    ReplyInput:
      type: object
      additionalProperties: false
      properties:
        regenerate: {type: boolean, description: Spend one shared AI call to replace an existing reply}
    SimulatedReply:
      type: object
      required: [text, replied_to, created_at]
      properties:
        text: {type: string, minLength: 1, maxLength: 280, description: AI-written in the voice of a fictional sample profile; never a real person}
        replied_to: {type: string, description: The saved icebreaker this reply answers}
        created_at: {type: string}
    ReplyResult:
      type: object
      required: [connection, remaining_builds, reused]
      properties:
        connection: {$ref: "#/components/schemas/Connection"}
        remaining_builds: {type: integer, minimum: 0, maximum: 5}
        reused: {type: boolean, description: True when an existing reply was returned without an AI call}
    NextStep:
      type: object
      required: [kind, title, text]
      properties:
        kind: {type: string, enum: [coffee_chat, shared_interest, ask_about]}
        title: {type: string}
        text: {type: string}
    Connection:
      type: object
      required: [id, deck_id, profile, visitor_profile, match_score, why_connect, icebreaker, direction, created_at, next_step, reply]
      properties:
        id: {type: integer}
        deck_id: {type: string}
        profile: {$ref: "#/components/schemas/SampleProfile"}
        visitor_profile:
          anyOf:
            - {$ref: "#/components/schemas/VisitorProfile"}
            - {type: "null"}
        match_score: {type: integer, minimum: 0, maximum: 100}
        why_connect: {type: string}
        icebreaker: {type: string, maxLength: 299}
        direction: {type: string, enum: [right, super]}
        created_at: {type: string}
        next_step:
          description: Deterministic suggestion derived from saved match data; never AI-generated
          anyOf:
            - {$ref: "#/components/schemas/NextStep"}
            - {type: "null"}
        reply:
          description: Persisted simulated sample reply, or null before one is requested
          anyOf:
            - {$ref: "#/components/schemas/SimulatedReply"}
            - {type: "null"}
    ConnectionList:
      type: object
      required: [connections, remaining_builds]
      properties:
        connections:
          type: array
          items: {$ref: "#/components/schemas/Connection"}
        remaining_builds: {type: integer, minimum: 0, maximum: 5}
    DeckSummary:
      type: object
      required: [connections_made, top_shared_interest]
      properties:
        connections_made: {type: integer, minimum: 0}
        top_shared_interest: {type: [string, "null"]}
    DeckReference:
      type: object
      additionalProperties: false
      required: [deck_id]
      properties:
        deck_id: {type: string, minLength: 1}
    ProfileEdit:
      type: object
      additionalProperties: false
      required: [deck_id, profile]
      properties:
        deck_id: {type: string, minLength: 1}
        profile: {$ref: "#/components/schemas/VisitorProfile"}
    SwipeInput:
      type: object
      additionalProperties: false
      required: [deck_id, profile_id, direction]
      properties:
        deck_id: {type: string, minLength: 1}
        profile_id: {type: integer, minimum: 1}
        direction: {type: string, enum: [left, right, super]}
    SwipeUndo:
      type: object
      additionalProperties: false
      required: [deck_id, swipe_id]
      properties:
        deck_id: {type: string, minLength: 1}
        swipe_id: {type: integer, minimum: 1}
    SavedSwipe:
      type: object
      required: [id, profile_id, direction, created_at]
      properties:
        id: {type: integer}
        profile_id: {type: integer}
        direction: {type: string, enum: [left, right, super]}
        created_at: {type: string}
    DeckActionFailure:
      type: object
      required: [error, code]
      properties:
        error: {type: string}
        code: {type: string, enum: [invalid_action, stale_deck, super_limit, confirm_profile]}
    VisitorProfile:
      type: object
      additionalProperties: false
      required: [first_name, school, major, year, career_goals, interests]
      properties:
        first_name: {type: [string, "null"], maxLength: 100}
        school: {type: [string, "null"], maxLength: 150}
        major: {type: [string, "null"], maxLength: 150}
        year: {type: [string, "null"], maxLength: 100}
        career_goals: {type: string, maxLength: 600}
        interests:
          type: array
          maxItems: 12
          items: {type: string, maxLength: 100}
    ProfileMatch:
      type: object
      additionalProperties: false
      required: [profile_id, match_score, why_connect, icebreaker]
      properties:
        profile_id: {type: integer, minimum: 1}
        match_score: {type: integer, minimum: 0, maximum: 100}
        why_connect: {type: string, minLength: 10, maxLength: 500}
        icebreaker: {type: string, minLength: 1, maxLength: 299}
    CareerTip:
      type: object
      additionalProperties: false
      required: [field, reason, profile_id]
      properties:
        field: {type: string, minLength: 1, maxLength: 150}
        reason: {type: string, minLength: 1, maxLength: 500}
        profile_id: {type: integer, minimum: 1}
    MatchmakingResult:
      type: object
      additionalProperties: false
      required: [visitor_profile, matches, career_tip, insufficient_input, reason]
      properties:
        visitor_profile:
          anyOf:
            - {$ref: "#/components/schemas/VisitorProfile"}
            - {type: "null"}
        matches:
          type: array
          maxItems: 10
          items: {$ref: "#/components/schemas/ProfileMatch"}
        career_tip:
          anyOf:
            - {$ref: "#/components/schemas/CareerTip"}
            - {type: "null"}
        insufficient_input: {type: boolean}
        reason: {type: [string, "null"], maxLength: 500}
    DeckInput:
      type: object
      additionalProperties: false
      required: [input_text]
      properties:
        input_text: {type: string, maxLength: 1000}
    DeckBuild:
      type: object
      required: [usage_id, deck_id, remaining_builds, result]
      properties:
        usage_id: {type: integer}
        deck_id: {type: string}
        remaining_builds: {type: integer, minimum: 0, maximum: 5}
        result: {$ref: "#/components/schemas/MatchmakingResult"}
    IcebreakerInput:
      type: object
      additionalProperties: false
      required: [profile_id]
      properties:
        profile_id: {type: integer, minimum: 1}
        connection_id: {type: integer, minimum: 1}
    IcebreakerDraft:
      type: object
      required: [profile_id, icebreaker, remaining_builds]
      properties:
        profile_id: {type: integer}
        icebreaker: {type: string, minLength: 1, maxLength: 299}
        remaining_builds: {type: integer, minimum: 0, maximum: 5}
        connection_id: {type: [integer, "null"]}
    VisitorState:
      type: object
      required: [input_text, remaining_builds, deck_id, deck, visitor_profile, profile_confirmed, deck_order, swipes, super_connects_left, deck_summary, deck_filter, visible_order, filter_options]
      properties:
        input_text: {type: string}
        remaining_builds: {type: integer, minimum: 0, maximum: 5}
        deck_id: {type: [string, "null"]}
        deck:
          anyOf:
            - {$ref: "#/components/schemas/MatchmakingResult"}
            - {type: "null"}
        visitor_profile:
          anyOf:
            - {$ref: "#/components/schemas/VisitorProfile"}
            - {type: "null"}
        profile_confirmed: {type: boolean}
        deck_order:
          type: array
          items: {type: integer}
        swipes:
          type: array
          items: {$ref: "#/components/schemas/SavedSwipe"}
        super_connects_left: {type: integer, minimum: 0, maximum: 3}
        deck_summary: {$ref: "#/components/schemas/DeckSummary"}
        deck_filter: {$ref: "#/components/schemas/DeckFilter"}
        visible_order:
          description: deck_order narrowed by deck_filter, same relative order
          type: array
          items: {type: integer}
        filter_options:
          type: array
          items: {$ref: "#/components/schemas/DeckFilterOption"}
    ActionError:
      type: object
      required: [error, code, remaining_builds]
      properties:
        error: {type: string}
        code:
          type: string
          enum: [invalid_input, insufficient_input, visitor_limit, global_limit, ai_unavailable, invalid_profile]
        remaining_builds: {type: integer, minimum: 0, maximum: 5}
    SampleProfile:
      type: object
      required: [id, first_name, school, major, year, headline, career_goals, interests, ask_me_about, is_sample]
      properties:
        id: {type: integer}
        first_name: {type: string}
        school: {type: string}
        major: {type: string}
        year: {type: string}
        headline: {type: string}
        career_goals: {type: string}
        interests:
          type: array
          items: {type: string}
        ask_me_about: {type: string}
        is_sample: {type: boolean}
    HistoryRecord:
      type: object
      required: [id, input_text, status, is_sample, is_yours, created_at, top_matches, career_tip, output_json]
      properties:
        id: {type: integer}
        input_text: {type: string}
        status:
          type: string
          enum: [success, error, rate_limited, invalid_input]
        is_sample: {type: boolean}
        is_yours: {type: boolean}
        created_at: {type: string}
        top_matches:
          type: array
          items: {type: string}
        career_tip: {type: string}
        output_json: {type: string, description: Redacted JSON text for expandable details}
    HistoryPage:
      type: object
      required: [records, total, sample_count, profile_count, school_count]
      properties:
        records:
          type: array
          items:
            $ref: "#/components/schemas/HistoryRecord"
        total: {type: integer}
        sample_count: {type: integer}
        profile_count: {type: integer}
        school_count: {type: integer}
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status

